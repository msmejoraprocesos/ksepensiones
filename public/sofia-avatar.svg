<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <style>
    @keyframes blink {
      0%,90%,100%{transform:scaleY(1)}
      95%{transform:scaleY(0.1)}
    }
    @keyframes breathe {
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-2px)}
    }
    @keyframes pulse-ant {
      0%,100%{r:3;opacity:0.5}
      50%{r:5;opacity:1}
    }
    .s-body { animation: breathe 3s ease-in-out infinite; transform-origin: 60px 65px; }
    .s-eye-l { animation: blink 4s ease-in-out infinite; transform-origin: 47px 52px; }
    .s-eye-r { animation: blink 4s ease-in-out infinite 0.15s; transform-origin: 73px 52px; }
    .s-ant { animation: pulse-ant 2s ease-in-out infinite; }
  </style>

  <g class="s-body">
    <!-- Antena -->
    <line x1="60" y1="6" x2="60" y2="20" stroke="#1B3A6B" stroke-width="2" stroke-linecap="round"/>
    <circle class="s-ant" cx="60" cy="5" r="3" fill="#F05B21"/>

    <!-- Cabello -->
    <ellipse cx="60" cy="20" rx="23" ry="6" fill="#0F2548"/>
    <rect x="37" y="20" width="5" height="14" rx="2.5" fill="#0F2548"/>
    <rect x="78" y="20" width="5" height="14" rx="2.5" fill="#0F2548"/>

    <!-- Cabeza -->
    <rect x="37" y="20" width="46" height="42" rx="12" fill="#1B3A6B"/>

    <!-- Cara -->
    <rect x="42" y="26" width="36" height="30" rx="8" fill="#EEF2F8"/>

    <!-- Ojo izquierdo -->
    <g class="s-eye-l">
      <rect x="43" y="31" width="12" height="10" rx="5" fill="#1B3A6B"/>
      <circle cx="49" cy="36" r="3" fill="white"/>
      <circle cx="50" cy="35" r="1.2" fill="#1B3A6B"/>
    </g>

    <!-- Ojo derecho -->
    <g class="s-eye-r">
      <rect x="65" y="31" width="12" height="10" rx="5" fill="#1B3A6B"/>
      <circle cx="71" cy="36" r="3" fill="white"/>
      <circle cx="72" cy="35" r="1.2" fill="#1B3A6B"/>
    </g>

    <!-- Nariz -->
    <circle cx="60" cy="47" r="1.5" fill="#9CA3AF"/>

    <!-- Boca -->
    <path d="M52 52 Q60 58 68 52" stroke="#F05B21" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Mejillas -->
    <ellipse cx="46" cy="49" rx="4" ry="3" fill="#F05B21" opacity="0.25"/>
    <ellipse cx="74" cy="49" rx="4" ry="3" fill="#F05B21" opacity="0.25"/>

    <!-- Cuello -->
    <rect x="55" y="62" width="10" height="8" rx="3" fill="#1B3A6B"/>

    <!-- Cuerpo -->
    <rect x="38" y="70" width="44" height="36" rx="10" fill="#1B3A6B"/>

    <!-- Panel pecho -->
    <rect x="45" y="76" width="30" height="24" rx="5" fill="#0F2548"/>

    <!-- Indicadores -->
    <circle cx="52" cy="83" r="2.5" fill="#22C55E"/>
    <rect x="57" y="81" width="13" height="3" rx="1.5" fill="#F05B21" opacity="0.8"/>
    <rect x="57" y="86" width="10" height="3" rx="1.5" fill="#93C5FD" opacity="0.6"/>
    <rect x="57" y="91" width="12" height="3" rx="1.5" fill="#93C5FD" opacity="0.4"/>

    <!-- Brazos -->
    <rect x="24" y="72" width="14" height="8" rx="4" fill="#1B3A6B"/>
    <circle cx="22" cy="76" r="6" fill="#1B3A6B"/>
    <rect x="82" y="72" width="14" height="8" rx="4" fill="#1B3A6B"/>
    <circle cx="98" cy="76" r="6" fill="#1B3A6B"/>
  </g>
</svg>
